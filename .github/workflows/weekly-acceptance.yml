# TEST-04: weekly run with a real pi session against the acceptance scenarios; success rate and duration are logged.
name: Weekly acceptance
on:
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:
jobs:
  acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      PI_ACCEPTANCE: "1"
      PI_PROVIDER: ${{ vars.PI_PROVIDER }}
      PI_MODEL: ${{ vars.PI_MODEL }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: xvfb-run -a npx playwright test acceptance.real
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: acceptance-results, path: acceptance-results }
