name: CI
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - name: End-to-end tests (Chrome with the extension, mock bridge and real pi with a scripted model)
        run: xvfb-run -a npx playwright test --grep-invert "acceptance"
      - uses: actions/upload-artifact@v4
        if: failure()
        with: { name: playwright-results, path: test-results }
